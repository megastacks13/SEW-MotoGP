<main>
    <section>
        <h2>Texto de muestra</h2>
        <p></p>
    </section>

    <section>
        <h3>Información Secundaria:</h3>
    </section>
</main>

<script>
    // Crear el objeto ciudad
    const ciudad = new Ciudad("Motegi", "Japón", "Motegiense");
    ciudad.getMetereologiaCarrera(() => {
        ciudad.getMetereologiaEntrenos();
    });
    ciudad.fill(11631, '36°32′01″N 140°13′39″E');

    // Seleccionamos los elementos sin usar id ni class
    const secciones = document.querySelectorAll('main > section');
    const primeraSeccion = secciones[0];
    const segundaSeccion = secciones[1];

    const h2 = primeraSeccion.querySelector('h2');
    const p1 = primeraSeccion.querySelector('p');

    // Rellenamos el contenido
    h2.textContent = ciudad.getNombreCiudad();
    p1.textContent = `Esta ciudad pertenece a ${ciudad.getPaisCiudad()} y su centro está situado en las siguientes coordenadas:`;
    ciudad.writeCoordenadas();
    segundaSeccion.innerHTML += ciudad.getInformacionSecundaria();
</script>
